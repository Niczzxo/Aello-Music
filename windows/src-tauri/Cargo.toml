[package]
name = "aello"
version = "6.1.45"
description = "Aello for Windows — desktop music player (v6.1.45: professional desktop UI + full Android feature parity; unified version with Android)"
authors = ["Niczzxo"]
edition = "2021"

# Windows builds run on GitHub Actions (windows-latest); see
# .github/workflows/windows.yml. Local `cargo check` on Linux validates
# the Rust code (Tauri itself is cross-platform); the NSIS bundle is
# Windows-only and is produced by the Actions runner.

[lib]
name = "aello_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# InnerTube client (Phase 3): pure-Rust HTTPS via rustls so the Windows
# build needs no OpenSSL. tokio full: the Tauri runtime already uses it.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
url = "2"
regex = "1"
# base64 for the get_transcript params (base64("\n\x0b" + videoId)).
base64 = "0.22"

# SMTC (Windows only): the `windows` crate is NOT in the Linux build at
# all — target-specific so `cargo check` on Linux still passes. Version
# 0.62 matches the copy already in Cargo.lock (transitive via Tauri);
# the contract's 0.58 is superseded by the locked version.
# `Win32_System_WinRT` is needed for the shipped
# `ISystemMediaTransportControlsInterop` used by smtc.rs (the Win32 way
# to get an SMTC instance for a window).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Media", "Foundation", "Storage_Streams", "Win32_Foundation", "Win32_System_WinRT"] }
