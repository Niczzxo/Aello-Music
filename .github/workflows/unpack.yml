name: Unpack Averon source
on:
  workflow_dispatch:
jobs:
  unpack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and unpack
        run: |
          cat averon-source.zip.part-* > averon-source.zip
          unzip -o -q averon-source.zip
          cp -a averon-push/. .
          rm -rf averon-push averon-source.zip averon-source.zip.part-*
      - name: Commit full tree
        run: |
          git config user.name "Averon Bot"
          git config user.email "averon-bot@users.noreply.github.com"
          git add -A
          git commit -m "Averon — complete source"
          git push
